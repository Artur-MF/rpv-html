<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS - Criando um card de produto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Criar um card de produto-->
    <!-- A imagem deverá ser uma caixa cinza com um escrito FOTO no centro -->

    <main>
        <div class="card">
            <div class="imagem-card">
                <img src="https://i2.wp.com/likemagazine.com.br/midias/2023/10/Perfeito-para-o-dia-a-dia.jpg?ssl=1"
                    alt="" id="imagem-roupa">

                <div class="circle-coracao">🤍</div>
                <div class="circles">

                    <div class="circle1"></div>
                    <div class="circle2"></div>
                    <div class="circle3"></div>
                    <div class="circle4"></div>
                </div>

            </div>
            <div class="informacoes">
                <div class="titulo-produto">PRODUCT NAME</div>
                <div class="preco-produto"> $41.000<span>USD</span></div>
                <div class="descricao-produto"> Lorem ipsum, dolor sit amet consectetur adipisicing elit. Dolorem
                    tenetur quae non sint cumque deserunt, eius saepe nostrum cum ducimus vero, dolore!</div>
            </div>
    </main>


</body>

</html>
